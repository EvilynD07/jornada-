<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Jornada do Anjo ✦ Castiel's Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-container">
    <div id="quiz-screen">
      <span class="header-badge" id="step-badge">Fase 1 de 10</span>
      <h1 id="question-title">A Jornada Começa</h1>
      
      <div class="story-text" id="story-description">
        História do Castiel...
      </div>

      <div class="options-grid" id="options-container">
        </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div id="result-screen" class="hide">
      <span class="header-badge">✦ Fim do Capítulo ✦</span>
      <h2>Sua Afinidade com o Castiel</h2>
      <p id="result-text"></p>
      <button class="restart-btn" onclick="restartQuiz()">Jogar Novamente ➔</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
