<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Jornada do Anjo ✦ Castiel Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800;900&family=Special+Elite&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="angel-wings-bg"></div>

  <div class="quiz-container">
    <div class="anti-possession-symbol">✵</div>
    
    <div id="quiz-screen">
      <div class="header-tag">
        <span id="step-badge">CAPÍTULO 1 DE 10</span>
      </div>

      <h1 id="question-title">SUPERNATURAL</h1>
      <p class="sub-title">— A JORNADA DE CASTIEL —</p>
      
      <div class="story-text" id="story-description">
        Iniciando capítulo...
      </div>

      <div class="options-grid" id="options-container">
        </div>

      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="result-screen" class="hide">
      <div class="symbol-header">🗡️</div>
      <h2>REVELAÇÃO FINAL</h2>
      <div id="result-text" class="story-text"></div>
      <button class="restart-btn" onclick="restartQuiz()">⚡ JOGAR NOVAMENTE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
